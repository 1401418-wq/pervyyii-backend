<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title>Помощник ПРАЙМ-ТЕНТ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f2f5f8;
    color: #10222f;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    padding: 16px 20px;
    background: #031a2e;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: none;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: #12385c; color: #cfe2f2;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px; flex: none;
  }
  .header-info h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }
  .header-info p { font-size: 12px; color: #9db6cc; margin-top: 2px; }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .message {
    max-width: 86%; padding: 11px 15px; border-radius: 12px;
    font-size: 14px; line-height: 1.55; word-wrap: break-word; white-space: pre-wrap;
  }
  .message.bot { align-self: flex-start; background: #fff; color: #10222f; border: 1px solid rgba(3,26,46,0.08); }
  .message.user { align-self: flex-end; background: #12385c; color: #fff; }
  .typing { align-self: flex-start; padding: 13px 16px; background: #fff; border: 1px solid rgba(3,26,46,0.08); border-radius: 12px; display: flex; gap: 4px; }
  .typing span { width: 6px; height: 6px; background: #8aa6bd; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100% { opacity: 0.3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }

  .consent {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 16px; background: #eaf0f6; border-top: 1px solid rgba(3,26,46,0.08);
    font-size: 12px; color: #4a6379; line-height: 1.4; flex: none;
  }
  .consent input { margin-top: 2px; width: 15px; height: 15px; flex: none; accent-color: #12385c; cursor: pointer; }
  .consent label { cursor: pointer; flex: 1; min-width: 0; }
  .consent a { color: #12385c; }

  .input-area {
    padding: 12px 16px; background: #fff; border-top: 1px solid rgba(3,26,46,0.08);
    display: flex; gap: 9px; align-items: center; flex: none;
  }
  .input-area input {
    flex: 1; min-width: 0; border: 1px solid rgba(3,26,46,0.14); background: #f7fafc;
    border-radius: 9px; padding: 11px 13px; font-size: 14px; font-family: inherit;
    color: #10222f; outline: none; transition: border-color 0.15s;
  }
  .input-area input:focus { border-color: #12385c; }
  .input-area button {
    background: #12385c; color: #fff; border: none; border-radius: 9px;
    padding: 11px 18px; font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: opacity 0.15s; flex: none;
  }
  .input-area button:hover { opacity: 0.9; }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

  .powered {
    text-align: center; padding: 7px; background: #fff; flex: none;
    font-size: 11px; color: #90a4b5; border-top: 1px solid rgba(3,26,46,0.05);
  }
  .powered a { color: #6b8299; text-decoration: none; }
  .powered a:hover { text-decoration: underline; }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(3,26,46,0.15); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="avatar">ИИ</div>
  <div class="header-info">
    <h1>Помощник ПРАЙМ-ТЕНТ</h1>
    <p>Отвечу по тентовым сооружениям</p>
  </div>
</div>

<div class="messages" id="messages">
  <div class="message bot">Здравствуйте! Я ИИ-помощник компании ПРАЙМ-ТЕНТ. Готов немедленно помочь Вам в выборе нашей продукции, ответить на все вопросы по ней и сделать предварительный расчёт интересующего Вас тентового сооружения.</div>
</div>

<div class="consent">
  <input type="checkbox" id="consent">
  <label for="consent">Соглашаюсь с обработкой персональных данных согласно <a href="https://prime-tent.ru/privacy.html" target="_blank" rel="noopener">Политике</a></label>
</div>

<div class="input-area">
  <input type="text" id="input" placeholder="Напишите сообщение..." autocomplete="off" disabled>
  <button id="send" disabled>Отправить</button>
</div>

<div class="powered">
  Работает на <a href="https://pervyyii.ru" target="_blank" rel="noopener">Первом ИИ</a>
</div>

<script>
  const API_URL = "chat"; // относительный: работает и локально (/chat), и под префиксом /api/hub/chat
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const consentEl = document.getElementById("consent");
  const history = [];

  // Страница-источник (передаётся из embed.js через ?ref=)
  const params = new URLSearchParams(location.search);
  const referrer = params.get("ref") || document.referrer || "";
  const interest = (params.get("interest") || "").slice(0, 80);

  // Стабильный session_id на сессию — для серверной истории диалога
  let sessionId = sessionStorage.getItem("pt_sid");
  if (!sessionId) {
    sessionId = (crypto.randomUUID ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2));
    sessionStorage.setItem("pt_sid", sessionId);
  }
  function trackEvent(name) {
    try {
      fetch("widget-events", {method:"POST", headers:{"Content-Type":"application/json"},
        keepalive:true, body:JSON.stringify({client:"prime-tent", event:name,
          session_id:sessionId, page:referrer})}).catch(function(){});
    } catch (_) {}
  }

  function setEnabled(on) {
    inputEl.disabled = !on;
    sendBtn.disabled = !on;
  }
  consentEl.addEventListener("change", function () {
    setEnabled(consentEl.checked);
    if (consentEl.checked) { trackEvent("consent_given"); inputEl.focus(); }
  });

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "message " + who;
    div.textContent = text;
    messagesEl.appendChild(div);
    if (who === "bot") {
      // длинный ответ показываем с НАЧАЛА, а не с конца — верх сообщения к верху окна
      const mRect = messagesEl.getBoundingClientRect();
      const dRect = div.getBoundingClientRect();
      messagesEl.scrollTop += (dRect.top - mRect.top) - 8;
    } else {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }
  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing"; div.id = "typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideTyping() { const t = document.getElementById("typing"); if (t) t.remove(); }

  async function send() {
    if (!consentEl.checked) return;
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    trackEvent("message_sent");
    history.push({ role: "user", content: text });
    inputEl.value = "";
    setEnabled(false);
    showTyping();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: history,
          session_id: sessionId,
          client: "prime-tent",
          referrer: referrer,
          interest: interest
        })
      });
      const data = await res.json();
      hideTyping();
      if (data.reply) {
        addMessage(data.reply, "bot");
        history.push({ role: "assistant", content: data.reply });
      } else {
        addMessage("Извините, что-то пошло не так. Попробуйте позже или свяжитесь с нами напрямую.", "bot");
      }
    } catch (e) {
      hideTyping();
      addMessage("Нет связи. Проверьте интернет и попробуйте снова.", "bot");
    } finally {
      setEnabled(true);
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
</script>

</body>
</html>
